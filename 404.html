<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Page Not Found - Janik Jayasuriya</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--color-black);
      color: var(--color-white);
    }
    .error-page__code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 700;
      color: var(--color-gold);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-page__title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      margin-bottom: 0.75rem;
    }
    .error-page__text {
      color: rgba(255,255,255,0.7);
      max-width: 440px;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <div class="error-page">
    <div class="error-page__code">404</div>
    <h1 class="error-page__title">This page doesn't exist</h1>
    <p class="error-page__text">The page you're looking for may have been moved or the link may be incorrect.</p>
    <a href="/" class="btn-magnetic btn-magnetic--gold">Back to Home</a>
  </div>

</body>
</html>
